<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Quiz System</title>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#667eea,#764ba2);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            background:white;
            width:90%;
            max-width:750px;
            padding:55px;
            border-radius:28px;
            text-align:center;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
        }

        h1{
            font-size:50px;
            color:#333;
            margin-bottom:20px;
        }

        p{
            font-size:19px;
            color:#666;
            margin-bottom:35px;
        }

        .btn{
            display:inline-block;
            margin:10px;
            padding:15px 28px;
            background:#667eea;
            color:white;
            text-decoration:none;
            border-radius:14px;
            font-weight:bold;
        }

        .btn:hover{
            background:#4c63d2;
        }

        .logout{
            background:#ff5f6d;
        }

        .info{
            margin-top:25px;
            color:#555;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Smart Quiz System</h1>

    <p>
        Solve quizzes, see your score, and get recommendation packages for your weak topics.
    </p>

    <a class="btn" href="/login/">Login</a>
    <a class="btn" href="/register/">Register</a>
    <a class="btn" href="/topics/">Start Quiz</a>
    <a class="btn" href="/leaderboard/">Leaderboard</a>
    <a class="btn" href="/profile/">Profile</a>
    <a class="btn" href="/admin/">Admin Panel</a>

    {% if user.is_authenticated %}
        <a class="btn logout" href="/logout/">Logout</a>
        <div class="info">
            Logged in as {{ user.username }}
        </div>
    {% endif %}

</div>

</body>
</html>
